services:
  db:
    image: postgres:16-alpine
    container_name: fragrance_materials_db
    environment:
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: fragrance123
      POSTGRES_DB: fragrance_materials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
